name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands or a small spec. Remove credentials and personal data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit, Node.js version, and operating system
    validations:
      required: true
