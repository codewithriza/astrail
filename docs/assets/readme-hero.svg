<g fill="#c7d6dd" font-size="16" text-anchor="middle"><text x="700" y="142">OpenAPI</text><text x="700" y="216">GraphQL</text><text x="700" y="290">HTTP MCP</text><text x="920" y="216" fill="#a3f3ce">Policy gate</text><text x="1078" y="206">MCP</text><text x="1078" y="226">tools</text></g>
