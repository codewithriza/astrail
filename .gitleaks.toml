  '^sk-live_abcdefghijkl$',
  '^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.signature$',
  '^refund-ch_123-2026-06-25$',
]
