services:
  astrail:
    build:
      context: .
      args:
        NEXT_PUBLIC_NEON_AUTH_URL: ${NEXT_PUBLIC_NEON_AUTH_URL:-}
        NEXT_PUBLIC_NEON_DATA_API_URL: ${NEXT_PUBLIC_NEON_DATA_API_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_RUNTIME_BASE_URL: ${NEXT_PUBLIC_RUNTIME_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_ASTRAIL_GOOGLE_OAUTH_ENABLED: ${NEXT_PUBLIC_ASTRAIL_GOOGLE_OAUTH_ENABLED:-false}
        NEXT_PUBLIC_ASTRAIL_GITHUB_OAUTH_ENABLED: ${NEXT_PUBLIC_ASTRAIL_GITHUB_OAUTH_ENABLED:-false}
        NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
